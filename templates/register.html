{% extends "base.html" %}
{% block title %}Registro | ESPE{% endblock %}

{% block content %}
<div class="form-heading">
    <span class="eyebrow">NUEVA CUENTA</span>
    <h2>Crear una cuenta</h2>
    <p>Registra tus datos. La contraseña se almacenará protegida con bcrypt.</p>
</div>

<form method="post" class="auth-form">
    <label class="field">
        <span>Nombre de usuario</span>
        <div class="input-wrap">
            <span class="input-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14Z"/>
                </svg>
            </span>
            <input type="text" name="username" maxlength="80" placeholder="Tu nombre de usuario" autocomplete="username" required>
        </div>
    </label>

    <label class="field">
        <span>Correo electrónico</span>
        <div class="input-wrap">
            <span class="input-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5Z"/>
                </svg>
            </span>
            <input type="email" name="email" maxlength="190" placeholder="usuario@correo.com" autocomplete="email" required>
        </div>
    </label>

    <label class="field">
        <span>Contraseña</span>
        <div class="input-wrap">
            <span class="input-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-7-2a2 2 0 1 1 4 0v2h-4Zm2 10.7a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4Z"/>
                </svg>
            </span>
            <input type="password" name="password" minlength="8" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>
        </div>
    </label>

    <button class="btn btn-primary" type="submit">
        Crear cuenta
        <span aria-hidden="true">→</span>
    </button>
</form>

<div class="separator">
    <span></span>
    <p>o</p>
    <span></span>
</div>

<a class="btn btn-google" href="{{ url_for('login_google') }}">
    <svg class="google-logo" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5Z"/>
        <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4c-7.7 0-14.4 4.4-17.7 10.7Z"/>
        <path fill="#4CAF50" d="M24 44c5.1 0 9.8-1.9 13.3-5.1l-6.1-5.2C29.2 35.2 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.5 16.2 44 24 44Z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.7l6.1 5.2C36.9 39.3 44 34 44 24c0-1.2-.1-2.3-.4-3.5Z"/>
    </svg>
    Registrarme con Google
</a>

<p class="switch-text">
    ¿Ya tienes una cuenta?
    <a href="{{ url_for('login') }}">Iniciar sesión</a>
</p>
{% endblock %}
